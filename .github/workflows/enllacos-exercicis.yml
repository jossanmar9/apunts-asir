name: Añadir enlaces a ejercicios Python

on:
  push:
    paths:
      - '.github/workflows/enllacos-exercicis.yml'

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Actualizar generador
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('scripts/regenera_ejercicios_python.py')
          text = path.read_text(encoding='utf-8')
          old = '        md += [f"## Ejercicio {numero:02d} · {titulo}", enunciado, ""]'
          new = '        md += [f"## Ejercicio {numero:02d} · {titulo}", enunciado, "", f"[:material-language-python: Abrir ejercicio_{numero:02d}.py]({unidad}/ejercicio_{numero:02d}.py){{ .md-button }}", ""]'
          if old not in text:
              raise SystemExit('No se ha encontrado la línea esperada en el generador')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY

      - name: Regenerar páginas y ejercicios
        run: python scripts/regenera_ejercicios_python.py

      - name: Guardar cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/regenera_ejercicios_python.py docs/ejercicios/python
          git commit -m "Añadir enlaces a los .py desde la web"
          git push
