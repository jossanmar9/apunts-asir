name: Generar ZIP de ejercicios

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'docs/ejercicios/python/**'
      - 'docs/ejercicios/aso/**'
      - 'docs/ejercicios/iaw/**'
      - 'scripts/genera_zips_ejercicios.py'
      - 'scripts/anade_botones_descarga.py'
      - '.github/workflows/genera-zips-ejercicios.yml'

permissions:
  contents: write

concurrency:
  group: generar-zips-ejercicios
  cancel-in-progress: false

jobs:
  generar:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Regenerar ejercicios de Python
        run: |
          python scripts/regenera_ejercicios_python.py
          python scripts/regenera_ut3_python.py

      - name: Regenerar ejercicios de ASO
        run: python scripts/regenera_ejercicios_aso.py

      - name: Regenerar ejercicios de IAW
        run: python scripts/regenera_ejercicios_iaw.py

      - name: Añadir botones de descarga
        run: python scripts/anade_botones_descarga.py

      - name: Generar ZIP
        run: python scripts/genera_zips_ejercicios.py

      - name: Guardar ejercicios y ZIP actualizados
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/ejercicios
          if git diff --cached --quiet; then
            echo "No hay cambios que guardar"
          else
            git commit -m "Actualizar ejercicios y paquetes ZIP"
            git push
          fi
