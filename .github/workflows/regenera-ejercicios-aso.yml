name: Regenerar ejercicios ASO

on:
  push:
    paths:
      - 'docs/ejercicios/aso/**'
      - 'scripts/regenera_ejercicios_aso.py'
      - '.github/workflows/regenera-ejercicios-aso.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  regenerar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generar 170 ejercicios ASO
        run: python3 scripts/regenera_ejercicios_aso.py
      - name: Guardar cambios
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/ejercicios docs/ejercicios/aso mkdocs.yml
          if git diff --cached --quiet; then
            echo 'Sin cambios'
          else
            git commit -m 'Añadir 170 ejercicios de ASO'
            git push
          fi
