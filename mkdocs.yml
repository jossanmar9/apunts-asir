site_name: Apuntes ASIR
site_description: "Apuntes desarrollados de IAW, ASO, Python, Sostenibilidad y Git y GitHub, con explicaciones desde cero y problemas fáciles paso a paso para estudiar ASIR"
site_url: https://jossanmar9.github.io/apunts-asir/
repo_url: https://github.com/jossanmar9/apunts-asir
repo_name: apunts-asir
edit_uri: edit/main/docs/

hooks:
  - hooks.py

theme:
  name: material
  language: es
  icon:
    logo: material/server-network
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: amber
      toggle:
        icon: material/weather-night
        name: Modo oscuro
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: amber
      toggle:
        icon: material/weather-sunny
        name: Modo claro
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - content.action.edit

plugins:
  - search:
      lang: [es, en]

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.snippets:
      base_path:
        - .
      check_paths: true
  - attr_list
  - def_list
  - md_in_html
  - tables
  - toc:
      permalink: true
      toc_depth: 6

extra_css:
  - assets/stylesheets/extra.css

nav:
  - "Inicio": index.md
  - "IAW":
      - iaw/index.md
      - "Guía de estudio UT1 + UT2": iaw/00-guia-estudi.md
      - "UT1 · Entorno de implantación web": iaw/ut1.md
      - "UT2 · Programación web en servidor": iaw/ut2.md
  - "ASO":
      - aso/index.md
      - "UT1 · Bash": aso/ut1.md
      - "UT2 · Procesos, servicios y automatización": aso/ut2.md
  - "Python":
      - python-classe/index.md
      - "UT1 · Introducción a Python": python-classe/ut1.md
      - "UT2 · Objetos predefinidos y cadenas": python-classe/ut2.md
      - "UT3 · Control de flujo y bibliotecas sysadmin": python-classe/ut3.md
  - "Ejercicios":
      - ejercicios/index.md
      - "Python":
          - ejercicios/python/index.md
          - "UT1 · Introducción y tipos": ejercicios/python/ut1.md
          - "UT2 · Cadenas": ejercicios/python/ut2.md
          - "UT3 · Condicionales y sysadmin": ejercicios/python/ut3.md
      - "ASO":
          - ejercicios/aso/index.md
          - "UT1 · Bash · 120": ejercicios/aso/ut1.md
          - "UT2 · Procesos, servicios y automatización · 50": ejercicios/aso/ut2.md
      - "IAW":
          - ejercicios/iaw/index.md
          - "UT1 · Entorno web · 60": ejercicios/iaw/ut1.md
          - "UT2 · PHP · 50": ejercicios/iaw/ut2.md
  - "Git y GitHub":
      - git-github/index.md
  - "Sostenibilidad":
      - sostenibilidad/index.md
      - "1 · Sostenibilidad en las organizaciones": sostenibilidad/01-organizaciones.md
      - "2 · Retos ambientales y sociales": sostenibilidad/02-retos.md
      - "3 · ODS en el desempeño profesional": sostenibilidad/03-ods.md
      - "4 · Economía verde y circular": sostenibilidad/04-economia-circular.md
      - "5 · Actividades sostenibles y medioambiente": sostenibilidad/05-actividades.md
      - "6 · El plan de sostenibilidad": sostenibilidad/06-plan.md
  - "Cómo estudiar":
      - estudiar/index.md
      - "Consejos de programación": estudiar/consells.md
  - "Fuentes y cobertura": classe.md

copyright: Apuntes ASIR

validation:
  links:
    anchors: warn
    unrecognized_links: warn
