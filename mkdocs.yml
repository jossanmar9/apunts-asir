site_name: Apunts ASIR
site_description: "Resums per mòdul i tema d’IAW, ASO i Python, amb exemples propis resolts, guia de consulta i consells per a estudiar ASIR"
# El teu usuari de GitHub
site_url: https://jossanmar9.github.io/apunts-asir/
repo_url: https://github.com/jossanmar9/apunts-asir
repo_name: apunts-asir
edit_uri: edit/main/docs/

theme:
  name: material
  language: ca
  icon:
    logo: material/server-network
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: amber
      toggle:
        icon: material/weather-night
        name: Mode fosc
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: amber
      toggle:
        icon: material/weather-sunny
        name: Mode clar
  features:
    - navigation.tabs          # una pestanya per mòdul
    - navigation.sections
    - navigation.indexes       # la pàgina index.md de cada carpeta és la portada del mòdul
    - navigation.top
    - navigation.footer        # botons Anterior / Següent
    - search.suggest
    - search.highlight
    - content.code.copy        # botó de copiar als blocs de codi
    - content.code.annotate
    - content.tabs.link
    - content.action.edit

plugins:
  - search:
      lang: [es, en]

markdown_extensions:
  - admonition               # !!! note / tip / warning
  - pymdownx.details         # ??? desplegables
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.keys            # ++ctrl+c++
  - pymdownx.mark
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - attr_list
  - def_list
  - md_in_html
  - tables
  - toc:
      permalink: true

extra_css:
  - assets/stylesheets/extra.css

