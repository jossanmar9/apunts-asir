site_name: Apuntes ASIR
site_description: "Resúmenes por módulo y tema de IAW, ASO y Python, Git y GitHub, ejemplos propios resueltos y consejos para estudiar ASIR"
# Tu usuario de GitHub
site_url: https://jossanmar9.github.io/apunts-asir/
repo_url: https://github.com/jossanmar9/apunts-asir
repo_name: apunts-asir
edit_uri: edit/main/docs/

theme:
  name: material
  language: es
  icon:
    logo: material/server-network
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: amber
      toggle:
        icon: material/weather-night
        name: Modo oscuro
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: amber
      toggle:
        icon: material/weather-sunny
        name: Modo claro
  features:
    - navigation.tabs          # una pestaña por módulo
    - navigation.sections
    - navigation.indexes       # index.md es la portada de cada módulo
    - navigation.top
    - navigation.footer        # botones Anterior / Siguiente
    - search.suggest
    - search.highlight
    - content.code.copy        # botón para copiar bloques de código
    - content.code.annotate
    - content.tabs.link
    - content.action.edit

plugins:
  - search:
      lang: [es, en]

markdown_extensions:
  - admonition               # !!! note / tip / warning
  - pymdownx.details         # ??? desplegables
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.keys            # ++ctrl+c++
  - pymdownx.mark
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - attr_list
  - def_list
  - md_in_html
  - tables
  - toc:
      permalink: true

extra_css:
  - assets/stylesheets/extra.css

