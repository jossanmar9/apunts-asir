          - "2.2 · Métodos y operaciones con cadenas": python-classe/ut2-02-metodos-cadenas.md
          - "2.3 · F-strings, formato y Unicode": python-classe/ut2-03-fstrings-unicode.md
      - "UT3 · Control de flujo y bibliotecas sysadmin":
