site_name: Apuntes ASIR
site_description: "Apuntes desarrollados de IAW, ASO, Python, Sostenibilidad y Git y GitHub, con explicaciones desde cero y problemas fáciles paso a paso para estudiar ASIR"
site_url: https://jossanmar9.github.io/apunts-asir/
repo_url: https://github.com/jossanmar9/apunts-asir
repo_name: apunts-asir
edit_uri: edit/main/docs/

theme:
  name: material
  language: es
  icon:
    logo: material/server-network
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: amber
      toggle:
        icon: material/weather-night
        name: Modo oscuro
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: amber
      toggle:
        icon: material/weather-sunny
        name: Modo claro
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - content.action.edit

plugins:
  - search:
      lang: [es, en]

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - attr_list
  - def_list
  - md_in_html
  - tables
  - toc:
      permalink: true

extra_css:
  - assets/stylesheets/extra.css

nav:
  - "Inicio": index.md
  - "IAW":
      - iaw/index.md
      - "Guía de estudio UT1 + UT2": iaw/00-guia-estudi.md
      - "UT1 · Entorno de implantación web":
          - "Arquitectura y componentes": iaw/01-arquitectura.md
          - "HTTP y diagnóstico": iaw/02-http.md
          - "Docker Compose y entorno reproducible": iaw/03-entorn.md
      - "UT2 · Programación web en servidor":
          - "PHP y tipos de datos": iaw/04-php.md
          - "Control de flujo, arrays y funciones": iaw/05-control-funcions.md
          - "Formularios y validación": iaw/06-formularis.md
          - "Cookies, sesiones y autenticación": iaw/07-estat.md
          - "Depuración y comprobaciones": iaw/08-depuracio.md
  - "ASO":
      - aso/index.md
      - "UT1 · Bash":
          - "Guía de estudio y repaso": aso/01-guia-estudi-bash.md
          - "Scripts, variables y parámetros": aso/02-bash-dades.md
          - "Cálculos y decisiones": aso/03-bash-decisions.md
          - "Bucles y funciones": aso/04-bash-bucles.md
          - "Archivos, filtros y expresiones regulares": aso/05-bash-text.md
          - "Errores y scripts de administración": aso/06-bash-errors.md
      - "UT2 · Procesos, servicios y automatización":
          - "Procesos en Linux": aso/07-processos.md
          - "Control, señales y prioridades": aso/08-control-processos.md
          - "Servicios y systemd": aso/09-systemd.md
          - "Automatización: cron y at": aso/10-automatitzacio.md
          - "Monitorización, logs y diagnóstico": aso/11-monitoritzacio.md
  - "Python":
      - python-classe/index.md
      - "UT1 · Introducción a Python":
          - "1.1 · Introducción a la programación": python-classe/ut1-01-introduccion.md
          - "1.2 · Entorno de desarrollo": python-classe/ut1-02-entorno.md
          - "1.3 · Datos, variables, tipos y objetos": python-classe/ut1-03-datos.md
          - "1.4 · Números, booleanos y operadores": python-classe/ut1-04-numeros-operadores.md
          - "1.5 · Cadenas, entrada/salida y f-strings": python-classe/ut1-05-cadenas-entrada-salida.md
      - "UT2 · Objetos predefinidos y cadenas":
